<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1233">
<title>Date Masters</title>
<meta name="description" content="Booster d'idées de dates">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Date Masters">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6eefb;--bg2:#ead9f5;--ink:#2a1233;--mut:#7b6188;--card:#fff;--line:#e2cdf0;--acc:#e0357a;--gold:#f5b942;--shadow:0 10px 30px rgba(80,20,100,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0b26;--bg2:#2e1240;--ink:#fbeefe;--mut:#b595c4;--card:#3a1a4d;--line:#51276b;--shadow:0 10px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#1d0b26;--bg2:#2e1240;--ink:#fbeefe;--mut:#b595c4;--card:#3a1a4d;--line:#51276b;--shadow:0 10px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative}
h1{font-family:'Bagel Fat One','Bricolage Grotesque',sans-serif;font-weight:400;font-size:28px;margin:0;letter-spacing:.5px;background:linear-gradient(90deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
header{padding:14px 20px 4px;display:flex;justify-content:space-between;align-items:center}
.sub{font-size:13px;color:var(--mut)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow-y:auto;padding:8px 20px 20px}
.view.on{display:block}
#v-boost.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden}
nav{display:flex;gap:6px;padding:8px 16px 12px;background:var(--bg);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 14px 'Bricolage Grotesque',sans-serif;padding:10px;border-radius:14px;cursor:pointer}
nav button.on{background:var(--card);color:var(--acc);box-shadow:var(--shadow)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* booster */
.stage{position:relative;width:230px;height:320px;perspective:900px;touch-action:none;--rc:#c9a0ff;--g:rgba(170,110,255,.55)}
.rays{position:absolute;left:50%;top:50%;width:780px;height:780px;margin:-390px 0 0 -390px;pointer-events:none;background:repeating-conic-gradient(var(--rc) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 66%);mask:radial-gradient(circle,#000 0,transparent 66%);opacity:0;transform:scale(.3);transition:opacity .8s,transform 1.2s;animation:spin 16s linear infinite}
.rays.on{opacity:.6;transform:scale(1)}
.pack{position:absolute;inset:0;cursor:pointer;animation:float 3.2s ease-in-out infinite}
.pack.charge{animation:charge var(--dur,1100ms) cubic-bezier(.5,0,.9,.5) forwards}
.pack.gone{animation:none;opacity:0;transform:translateY(60px) scale(.9);transition:.5s}
.foil,.pack .top{position:absolute;inset:0;border-radius:18px;background:linear-gradient(115deg,#ff4f9a,#ffb347 28%,#5be3c4 55%,#7a6bff 80%,#ff4f9a);background-size:250% 250%;animation:sheen 5s linear infinite;box-shadow:var(--shadow)}
.foil{clip-path:polygon(0 17%,10% 20%,20% 16%,30% 20%,40% 16%,50% 20%,60% 16%,70% 20%,80% 16%,90% 20%,100% 17%,100% 100%,0 100%)}
.pack .top{clip-path:polygon(0 0,100% 0,100% 17%,90% 20%,80% 16%,70% 20%,60% 16%,50% 20%,40% 16%,30% 20%,20% 16%,10% 20%,0 17%);transform-origin:0 0;transition:transform .7s cubic-bezier(.3,.7,.4,1),opacity .7s}
.pack.tear .top{transform:translate(90px,-190px) rotate(40deg);opacity:0}
/* effet d'enchantement façon Minecraft */
.glint,.foil::after,.pack .top::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:screen;background-image:linear-gradient(45deg,transparent 0 20%,var(--g) 20% 32%,transparent 32% 70%,var(--g) 70% 82%,transparent 82%),linear-gradient(-45deg,transparent 0 12%,var(--g) 12% 22%,transparent 22% 50%,transparent 50% 62%,var(--g) 62% 72%,transparent 72%);background-size:72px 72px,96px 96px;animation:glint 4s linear infinite}
.glint{opacity:.55}
.foil::after,.pack .top::after{opacity:.3}
.label{position:absolute;inset:26% 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;text-shadow:0 2px 8px rgba(60,0,60,.5);pointer-events:none}
.label b{font:400 34px/1 'Bagel Fat One',sans-serif;transform:rotate(-6deg)}
.label span{font-size:46px;margin-top:10px}
.label i{font-style:normal;font-size:13px;margin-top:10px;opacity:.95}
.flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,#fff,var(--fc,#fff) 40%,transparent 75%)}
.flash.go{animation:flash .9s ease-out}
.ring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:5px solid var(--rc);pointer-events:none;animation:ring .9s ease-out forwards}
.spark{position:absolute;left:50%;top:50%;border-radius:2px;pointer-events:none;animation:fly 1.1s cubic-bezier(.1,.8,.3,1) forwards}
.card{position:absolute;inset:0;transform-style:preserve-3d;transform:translateY(80px) scale(.3) rotateY(180deg);opacity:0;transition:transform 1s cubic-bezier(.2,1.3,.3,1),opacity .4s}
.card.show{opacity:1;transform:none}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out;animation:bob 3.4s ease-in-out infinite}
.face{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow);isolation:isolate}
.front{background:linear-gradient(160deg,#2a1240,#4b1d66 60%,#2a1240);color:#fff;border:4px solid var(--rc);padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;transform:rotateY(180deg)}
.card.flip .front{transform:rotateY(0)}
.card.flip .back{transform:rotateY(-180deg)}
.card[data-r="1"] .front{box-shadow:0 0 26px var(--rc)}
.card[data-r="2"] .front{box-shadow:0 0 38px 4px var(--rc)}
.card[data-r="3"] .front{animation:pulse 1.6s ease-in-out infinite}
.back{background:linear-gradient(135deg,#6a4cff,#e0357a);display:flex;align-items:center;justify-content:center;font-size:64px;border:4px solid rgba(255,255,255,.35)}
.holo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:overlay;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),rgba(255,255,255,.55),transparent 50%)}
.card[data-r="2"] .holo,.card[data-r="3"] .holo{background:radial-gradient(circle at var(--mx,50%) var(--my,25%),rgba(255,255,255,.5),transparent 50%),linear-gradient(115deg,transparent 15%,rgba(255,60,160,.4) 30%,rgba(60,255,220,.4) 50%,rgba(255,230,60,.4) 70%,transparent 85%);background-size:auto,220% 220%;background-position:0 0,var(--mx,50%) var(--my,50%)}
.front .cat{background:var(--cc);color:#fff;font-weight:700;font-size:13px;padding:5px 12px;border-radius:99px}
.front .em{font-size:60px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.front p{margin:0;font-size:19px;line-height:1.25;font-weight:700}
.stars{font-weight:700;font-size:12px;letter-spacing:1.5px;color:var(--rc);text-transform:uppercase}
.card.flip{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.card .front,.card .back{transition:transform .7s}
.actions{display:flex;gap:10px;min-height:48px}
.btn{border:0;border-radius:16px;padding:14px 20px;font:700 16px 'Bricolage Grotesque',sans-serif;cursor:pointer;background:linear-gradient(90deg,var(--acc),#ff7a45);color:#fff;box-shadow:var(--shadow)}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.hint{font-size:14px;color:var(--mut);text-align:center;min-height:20px}
.snd{border:0;background:var(--card);border-radius:12px;font-size:18px;padding:6px 10px;margin-left:8px;cursor:pointer}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#stars i{position:absolute;background:var(--gold);opacity:0;animation:tw 3s ease-in-out infinite}
#app{z-index:1}
#app.quake{animation:quake .55s}
@keyframes charge{0%{transform:none;filter:brightness(1) drop-shadow(0 0 0 var(--rc))}15%{transform:rotate(-2deg) scale(1.02)}30%{transform:rotate(3deg) scale(1.04)}45%{transform:rotate(-4deg) scale(1.06);filter:brightness(1.3) drop-shadow(0 0 18px var(--rc))}60%{transform:rotate(5deg) scale(1.08)}75%{transform:rotate(-6deg) scale(1.11);filter:brightness(1.6) drop-shadow(0 0 32px var(--rc))}90%{transform:rotate(7deg) scale(1.14)}100%{transform:rotate(0) scale(1.18);filter:brightness(2.2) drop-shadow(0 0 50px var(--rc))}}
@keyframes glint{to{background-position:72px 72px,-96px 96px}}
@keyframes spin{to{rotate:360deg}}
@keyframes bob{50%{translate:0 -8px}}
@keyframes pulse{50%{box-shadow:0 0 70px 12px var(--rc)}0%,100%{box-shadow:0 0 40px 6px var(--rc)}}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(3.4);opacity:0}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.1);opacity:0}}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(calc(var(--q) * -1),var(--q))}40%{transform:translate(var(--q),calc(var(--q) * -1))}60%{transform:translate(calc(var(--q) * -.6),calc(var(--q) * .6))}80%{transform:translate(calc(var(--q) * .5),0)}}
@keyframes tw{50%{opacity:.7;transform:scale(1.6) rotate(45deg)}}

/* collection */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 13px 'Bricolage Grotesque',sans-serif;cursor:pointer}
.chip.on{background:var(--cc,var(--acc));border-color:transparent;color:#fff}
.add{display:flex;flex-direction:column;gap:8px;background:var(--card);padding:14px;border-radius:18px;margin-bottom:14px;border:1px solid var(--line)}
.add input,.add select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 16px 'Bricolage Grotesque',sans-serif}
.row{display:flex;gap:8px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:10px;background:var(--card);border-left:5px solid var(--cc);border-radius:14px;padding:10px 12px;font-size:15px}
li .t{flex:1}
li.done .t{text-decoration:line-through;opacity:.5}
li button{border:0;background:none;font-size:20px;cursor:pointer;color:var(--mut);padding:6px}
.empty{text-align:center;color:var(--mut);padding:30px 0}

@keyframes float{50%{transform:translateY(-10px) rotate(1.5deg)}}
@keyframes sheen{to{background-position:250% 250%}}
@keyframes shake{0%,100%{transform:none}10%{transform:rotate(-4deg)}20%{transform:rotate(5deg) scale(1.03)}30%{transform:rotate(-6deg)}40%{transform:rotate(7deg) scale(1.06)}55%{transform:rotate(-8deg)}70%{transform:rotate(9deg) scale(1.09)}85%{transform:rotate(-9deg) scale(1.1)}}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

.actions .btn{padding:14px 16px}
.sharebtn{width:52px;padding:14px 0!important}
.mood{width:100%;justify-content:flex-start;padding:0 0 4px;margin:-6px 0 0}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.stat b{display:block;font:400 24px 'Bagel Fat One',sans-serif;background:linear-gradient(90deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:11px;color:var(--mut)}
.tools{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
li .t{cursor:text}
li small{display:block;font-size:11px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--gold);font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="stars"></div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="app">
  <header><h1>Date Masters</h1><div style="display:flex;align-items:center"><span class="sub" id="count"></span><button class="snd" id="snd" aria-label="Son">🔊</button></div></header>
  <main>
    <section class="view on" id="v-boost">
      <div class="stage" id="stage">
        <div class="rays" id="rays"></div>
        <div class="card" id="card" aria-live="polite">
          <div class="tilt">
            <div class="face back">💘<i class="glint"></i></div>
            <div class="face front"><span class="cat" id="ccat"></span><span class="em" id="cem"></span><p id="ctxt"></p><span class="stars" id="crar"></span><i class="glint"></i><i class="holo"></i></div>
          </div>
        </div>
        <div class="pack" id="pack" role="button" tabindex="0" aria-label="Ouvrir le booster">
          <div class="foil"></div>
          <div class="label"><b>DATE<br>MASTERS</b><span>💘</span><i>Booster d'idées</i></div>
          <div class="top"></div>
        </div>
      </div>
      <div class="hint" id="hint">Touche le booster pour l'ouvrir</div>
      <div class="actions" id="actions"></div>
      <div class="chips mood" id="mood" aria-label="Filtrer les catégories du booster"></div>
    </section>
    <section class="view" id="v-coll">
      <div class="stats" id="stats"></div>
      <div class="tools"><button class="chip" id="shareList">📤 Partager mes idées</button><button class="chip" id="importList">📥 Importer</button><button class="chip" id="resetDone">↺ Tout remettre à tenter</button></div>
      <div class="add">
        <input id="newT" placeholder="Ta nouvelle idée de date…" maxlength="90">
        <div class="row"><select id="newC"></select><button class="btn" id="addBtn">Ajouter</button></div>
      </div>
      <div class="chips" id="chips"></div>
      <ul id="list"></ul>
    </section>
  </main>
  <nav>
    <button class="on" data-v="boost">Booster</button>
    <button data-v="coll">Mes idées</button>
  </nav>
</div>
<script>
const CATS={bouge:['Ça bouge','🔥','#f0562f'],creatif:['Créatif','🎨','#9b4dff'],gourmand:['Gourmand','🍷','#d6246e'],calme:['Cocooning','😴','#2f8fe6'],culture:['Culture','🎭','#d99100'],nature:['Nature','🌿','#1fa86f'],fun:['Fun & décalé','😂','#ee6a10']};
const DEF={
bouge:["Escape game (en extérieur ou en VR)","Laser game ou paintball : l'un contre l'autre","Trampoline park ou accrobranche","Karting ou bubble foot","Initiation à l'escalade en salle de bloc","Cours de danse : salsa, bachata, rock, tango","Patinoire ou roller le long d'un canal","Paddle, kayak ou course de pédalos avec pari","Balade en tandem + pique-nique","Tir à l'arc ou lancer de hache","Course d'orientation en forêt","Minigolf","Bowling ou billard avec gages","Via ferrata ou saut en parachute"],
creatif:["Atelier poterie (façon Ghost, mais en rigolant)","Cours de cuisine : pâtisserie, chocolat, sushi","Atelier parfum, bougie ou bijoux","Peinture et vin","Gravure sur cuir, soufflage de verre ou forge","Créer un jeu de société maison","Atelier cocktails : inventer sa recette","Customiser des vêtements ou des sneakers"],
gourmand:["Dégustation : vin, fromage, chocolat, whisky, thé","Food tour : un plat par resto","Pique-nique chic avec panier","Restaurant dans le noir","Brunch autour du monde : un pays par plat","Concours de cuisine : même panier, chacun son plat","Cueillette de fruits, champignons ou huîtres","Marché + cuisine improvisée","Dîner insolite : bateau, tramway, bulle, cabane"],
calme:["Spa, hammam ou bains nordiques","Massage en duo","Nuit en cabane, yourte ou bulle sous les étoiles","Ciné maison à thème (films de votre année de naissance)","Cinéma en plein air ou drive-in","Observer les étoiles ou aller au planétarium","Jeux vidéo coop : It Takes Two, Overcooked","Puzzle de 1000 pièces, playlist et thé","Lire un livre à voix haute à tour de rôle","Karaoké privé","Sieste en hamac puis café"],
culture:["Théâtre d'impro ou stand-up dans un petit bar","Concert intimiste, jazz club ou opéra","Musée de nuit ou musée insolite","Exposition immersive","Visite guidée décalée : catacombes, street art, Paris by night","Chasse au trésor urbaine ou murder party","Cirque, magie ou comédie musicale","Château ou jardin (Versailles)","Brocante : l'objet le plus bizarre pour moins de 5 €"],
nature:["Rando au lever ou coucher du soleil","Balade à cheval ou en calèche","Montgolfière","Bivouac ou camping sauvage","Baignade en lac ou plage hors saison","Ferme pédagogique ou câlins avec des alpagas","Week-end surprise : destination tirée au sort à 2h de route","Feu de camp avec marshmallows"],
fun:["Défi photo : recréer des photos de couples célèbres","Refaire exactement votre premier rendez-vous","Date à l'aveugle : chacun prépare une surprise","Touristes dans votre propre ville","Blind test à deux","Tournoi : fléchettes, ping-pong, baby-foot, Mario Kart","Soirée « on s'habille bizarre » et on sort","Capsule temporelle : des lettres à ouvrir dans un an","Défi 5 € : le cadeau le plus drôle","Dîner des 36 questions pour tomber amoureux","Fête foraine : auto-tamponneuses et barbe à papa","Apprendre un truc ensemble : jonglage, magie, japonais"]};
const KEY='datemasters_v1',PK='dm_pref',SK='dm_stats';
let ideas=[],filter='all',current=null,busy=false,pref={cats:[]},stats={draws:0,legend:0,done:0,pity:0};
const $=id=>document.getElementById(id);
function rd(k,d){try{const r=localStorage.getItem(k);return r?Object.assign(d,JSON.parse(r)):d}catch(e){return d}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(){pref=rd(PK,pref);stats=rd(SK,stats);if(!Array.isArray(pref.cats))pref.cats=[];
 try{const r=localStorage.getItem(KEY);if(r){const a=JSON.parse(r);if(Array.isArray(a)&&a.every(x=>x&&typeof x.t==='string')){ideas=a;return}}}catch(e){}
 ideas=[];let n=0;for(const c in DEF)DEF[c].forEach(t=>ideas.push({id:'d'+n++,t,c,done:false}))}
function save(){wr(KEY,ideas)}
function renderStats(){$('stats').innerHTML=[['🎴',stats.draws,'Tirages'],['⭐',stats.legend,'Légendaires'],['✅',stats.done,'Dates faits']].map(([e,n,l])=>'<div class="stat"><b>'+n+'</b><span>'+e+' '+l+'</span></div>').join('')}
function updCount(){const left=ideas.filter(i=>!i.done).length;$('count').textContent=left+' idée'+(left>1?'s':'')+' à tenter';renderStats()}
let tt;function toast(msg,label,fn){const t=$('toast');t.innerHTML='';const m=document.createElement('span');m.textContent=msg;t.appendChild(m);
 if(label){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();t.classList.remove('on')};t.appendChild(b)}
 t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),label?5000:2600)}
async function shareText(text,url){try{if(navigator.share){await navigator.share(url?{title:'Date Masters',text,url}:{text});return}}catch(e){if(e&&e.name==='AbortError')return}
 const full=url?text+' '+url:text;try{await navigator.clipboard.writeText(full);toast('Copié dans le presse-papiers 📋')}catch(e){prompt('Copie ce texte :',full)}}
const enc=a=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(a))));
const dec=c=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c),ch=>ch.charCodeAt(0))));
function mergeCode(raw){try{let c=raw.trim();const k=c.indexOf('#import=');if(k>=0)c=c.slice(k+8);c=decodeURIComponent(c);const arr=dec(c);if(!Array.isArray(arr))return -1;
 const have=new Set(ideas.map(i=>i.t.toLowerCase()));let n=0;
 arr.forEach(x=>{let t=x&&x[0];if(typeof t!=='string'||!t.trim())return;t=t.trim().slice(0,90);if(have.has(t.toLowerCase()))return;have.add(t.toLowerCase());ideas.unshift({id:'u'+Date.now()+'_'+n,t,c:CATS[x[1]]?x[1]:'fun',done:false});n++});
 save();updCount();renderList();return n}catch(e){return -1}}

/* nav */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
 if(b.dataset.v==='coll')renderList()});

/* booster */
const pack=$('pack'),card=$('card');
function resetStage(){card.className='card';card.removeAttribute('data-r');untilt();pack.className='pack';pack.style.removeProperty('--dur');$('rays').classList.remove('on');$('flash').classList.remove('go');$('actions').innerHTML='';$('hint').textContent='Touche le booster pour l\'ouvrir';busy=false}
const RAR=[
 {n:'Commune',rc:'#c9a0ff',g:'rgba(160,100,255,.5)',sp:26,dur:1100,q:3,fc:'#d8c0ff'},
 {n:'Rare',rc:'#4aa8ff',g:'rgba(70,170,255,.6)',sp:40,dur:1250,q:6,fc:'#9fd2ff'},
 {n:'Épique',rc:'#e056ff',g:'rgba(225,90,255,.7)',sp:60,dur:1450,q:9,fc:'#f2a6ff'},
 {n:'Légendaire',rc:'#ffc940',g:'rgba(255,205,70,.75)',sp:90,dur:1700,q:13,fc:'#ffe9a0'}];
const roll=()=>{const r=Math.random();return r<.55?0:r<.82?1:r<.95?2:3};
let wake=null;
const sleep=ms=>new Promise(r=>{const t=setTimeout(go,ms);function go(){clearTimeout(t);wake=null;r()}wake=go});
let AC=null,snd=true;try{snd=localStorage.getItem('dm_snd')!=='0'}catch(e){}
function tone(f,t0,d,type,v,f2){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function chime(n){[523,659,784,1047,1319].slice(0,n).forEach((f,i)=>tone(f,i*.09,.55,'triangle',.09))}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
$('snd').textContent=snd?'🔊':'🔇';
$('snd').onclick=()=>{snd=!snd;$('snd').textContent=snd?'🔊':'🔇';try{localStorage.setItem('dm_snd',snd?'1':'0')}catch(e){}};
function sparks(R,col,n){const st=$('stage'),pal=[R.rc,'#fff','#ffd35c',col];for(let i=0;i<n;i++){const s=document.createElement('i'),a=Math.random()*6.28,d=90+Math.random()*190,z=5+Math.random()*9;
 s.className='spark';s.style.cssText='width:'+z+'px;height:'+z+'px;background:'+pal[i%4]+';--x:'+Math.cos(a)*d+'px;--y:'+(Math.sin(a)*d-30)+'px;--r:'+(Math.random()*720-360)+'deg';st.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function rings(){for(let i=0;i<2;i++)setTimeout(()=>{const r=document.createElement('div');r.className='ring';$('stage').appendChild(r);setTimeout(()=>r.remove(),950)},i*180)}
function quake(q){const a=$('app');a.style.setProperty('--q',q+'px');a.classList.remove('quake');void a.offsetWidth;a.classList.add('quake');setTimeout(()=>a.classList.remove('quake'),600)}
function boom(R){const f=$('flash');f.style.setProperty('--fc',R.fc);f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
async function open(){
 if(busy)return;
 const scope=ideas.filter(i=>!pref.cats.length||pref.cats.includes(i.c));
 if(!scope.length){$('hint').textContent=ideas.length?'Aucune idée dans cette catégorie':'Ajoute d\'abord des idées dans « Mes idées »';return}
 let pool=scope.filter(i=>!i.done);
 if(!pool.length){scope.forEach(i=>{i.done=false;delete i.doneAt});save();updCount();pool=scope;toast('Tout est fait ici ! Compteurs remis à zéro 🎉')}
 busy=true;current=pool[Math.floor(Math.random()*pool.length)];
 let rr=roll();if(stats.pity>=9&&rr<2)rr=2;
 stats.draws++;stats.pity=rr>=2?0:stats.pity+1;if(rr===3)stats.legend++;wr(SK,stats);renderStats();
 const R=RAR[rr],[lab,em,col]=CATS[current.c]||CATS.fun,st=$('stage');
 st.style.setProperty('--rc',R.rc);st.style.setProperty('--g',R.g);
 card.dataset.r=rr;card.style.setProperty('--cc',col);
 $('ccat').textContent=lab;$('cem').textContent=em;$('ctxt').textContent=current.t;$('ctxt').style.fontSize=(current.t.length>70?16:current.t.length>48?17.5:19)+'px';$('crar').textContent='★'.repeat(rr+1)+' '+R.n;
 $('hint').textContent='Touche pour passer l\'animation';
 pack.style.setProperty('--dur',R.dur+'ms');pack.classList.add('charge');$('rays').classList.add('on');
 tone(110,0,R.dur/1000,'sawtooth',.05,560);vib([30,60,30,60,40,50,60,40,90]);
 await sleep(R.dur);
 pack.classList.remove('charge');pack.classList.add('tear');
 boom(R);rings();sparks(R,col,R.sp);quake(R.q);tone(90,0,.4,'square',.12,35);vib(rr>2?[200,60,200]:120);
 await sleep(450);
 pack.classList.add('gone');card.classList.add('show');
 await sleep(750);
 card.classList.add('flip');chime(rr+2);
 if(rr>=2){setTimeout(()=>{sparks(R,col,40);rings()},500)}
 if(rr<2)$('rays').classList.remove('on');
 await sleep(900);
 $('hint').textContent=R.n+' ! Ton prochain date est…';
 const msg='💘 Date Masters m\'a tiré une carte '+R.n+' : « '+current.t+' » — ça te dit ?';
 $('actions').innerHTML='<button class="btn alt" id="again">Un autre booster</button><button class="btn" id="ok">On le fait !</button><button class="btn alt sharebtn" id="shareCard" aria-label="Partager la carte">📤</button>';
 $('again').onclick=resetStage;$('shareCard').onclick=()=>shareText(msg);
 $('ok').onclick=()=>{current.done=true;current.doneAt=Date.now();stats.done++;wr(SK,stats);save();updCount();sparks(R,col,30);chime(5);$('hint').textContent='Validé, bon date ! 💘';
  $('actions').innerHTML='<button class="btn alt" id="again2">Nouveau booster</button><button class="btn alt sharebtn" id="shareCard2" aria-label="Partager">📤</button>';$('again2').onclick=resetStage;$('shareCard2').onclick=()=>shareText(msg)};
}
pack.onclick=open;pack.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};

/* inclinaison de la carte au doigt */
function tiltTo(e){if(!card.classList.contains('flip'))return;const b=card.getBoundingClientRect(),x=Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),y=Math.min(1,Math.max(0,(e.clientY-b.top)/b.height));
 card.style.setProperty('--rx',(.5-y)*30+'deg');card.style.setProperty('--ry',(x-.5)*30+'deg');card.style.setProperty('--mx',x*100+'%');card.style.setProperty('--my',y*100+'%')}
function untilt(){['--rx','--ry','--mx','--my'].forEach(k=>card.style.removeProperty(k))}
const stg=$('stage');stg.addEventListener('pointermove',tiltTo);stg.addEventListener('pointerdown',tiltTo);stg.addEventListener('pointerdown',()=>{if(busy&&wake)wake()});stg.addEventListener('pointerleave',untilt);stg.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')untilt()});
/* étoiles d'ambiance */
(function(){const w=$('stars');for(let i=0;i<26;i++){const e=document.createElement('i'),z=3+Math.random()*4;e.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-delay:'+Math.random()*3+'s;animation-duration:'+(2.5+Math.random()*3)+'s';w.appendChild(e)}})();

/* collection */
function renderChips(){
 const all=[['all','Toutes','#e0357a'],...Object.entries(CATS).map(([k,v])=>[k,v[1]+' '+v[0],v[2]])];
 $('chips').innerHTML='';
 all.forEach(([k,l,c])=>{const b=document.createElement('button');b.className='chip'+(filter===k?' on':'');b.textContent=l;b.style.setProperty('--cc',c);b.onclick=()=>{filter=k;renderChips();renderList()};$('chips').appendChild(b)})}
function renderList(){
 const ul=$('list');ul.innerHTML='';
 const items=ideas.filter(i=>filter==='all'||i.c===filter);
 if(!items.length){ul.innerHTML='<div class="empty">Rien ici pour l\'instant. Ajoute ta première idée !</div>';return}
 items.forEach(i=>{const li=document.createElement('li');li.className=i.done?'done':'';li.style.setProperty('--cc',(CATS[i.c]||CATS.fun)[2]);
  li.innerHTML='<span>'+(CATS[i.c]||CATS.fun)[1]+'</span><span class="t" role="button" tabindex="0" title="Toucher pour modifier"></span><button aria-label="Fait / à faire">'+(i.done?'↩️':'✅')+'</button><button aria-label="Supprimer">🗑️</button>';
  const t=li.querySelector('.t');t.textContent=i.t;
  if(i.done&&i.doneAt){const sm=document.createElement('small');sm.textContent='Fait le '+new Date(i.doneAt).toLocaleDateString('fr-FR');t.appendChild(sm)}
  const edit=()=>{const v=prompt('Modifier l\'idée',i.t);if(v&&v.trim()){i.t=v.trim().slice(0,90);save();renderList()}};
  t.onclick=edit;t.onkeydown=e=>{if(e.key==='Enter')edit()};
  const [b1,b2]=li.querySelectorAll('button');
  b1.onclick=()=>{i.done=!i.done;if(i.done){i.doneAt=Date.now();stats.done++}else{delete i.doneAt;stats.done=Math.max(0,stats.done-1)}wr(SK,stats);save();updCount();renderList()};
  b2.onclick=()=>{const idx=ideas.indexOf(i);ideas.splice(idx,1);save();updCount();renderList();toast('Idée supprimée','Annuler',()=>{ideas.splice(Math.min(idx,ideas.length),0,i);save();updCount();renderList()})};
  ul.appendChild(li)})}
function renderMood(){const m=$('mood');m.innerHTML='';
 const mk=(k,l,c,on)=>{const b=document.createElement('button');b.className='chip'+(on?' on':'');b.textContent=l;b.style.setProperty('--cc',c);b.setAttribute('aria-pressed',on);
  b.onclick=()=>{if(busy)return;pref.cats=k==='all'?[]:pref.cats.includes(k)?pref.cats.filter(x=>x!==k):[...pref.cats,k];wr(PK,pref);renderMood()};m.appendChild(b)};
 mk('all','Tout','#e0357a',!pref.cats.length);Object.entries(CATS).forEach(([k,v])=>mk(k,v[1]+' '+v[0],v[2],pref.cats.includes(k)))}
$('shareList').onclick=()=>{const mine=ideas.filter(i=>String(i.id).startsWith('u'));if(!mine.length){toast('Ajoute d\'abord tes propres idées pour les partager');return}
 const url=location.href.split('#')[0]+'#import='+encodeURIComponent(enc(mine.map(i=>[i.t,i.c])));
 shareText('💘 Date Masters : '+mine.length+' idée'+(mine.length>1?'s':'')+' de date pour toi !',url)};
$('importList').onclick=()=>{const v=prompt('Colle ici le lien ou le code reçu :');if(!v)return;const n=mergeCode(v);toast(n<0?'Code invalide 😕':n+' idée'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''))};
$('resetDone').onclick=()=>{if(!ideas.some(i=>i.done)){toast('Rien à remettre à zéro');return}if(confirm('Remettre toutes les idées comme « à tenter » ?')){ideas.forEach(i=>{i.done=false;delete i.doneAt});save();updCount();renderList()}};
$('newC').innerHTML=Object.entries(CATS).map(([k,v])=>'<option value="'+k+'">'+v[1]+' '+v[0]+'</option>').join('');
function add(){const t=$('newT').value.trim();if(!t)return;ideas.unshift({id:'u'+Date.now(),t,c:$('newC').value,done:false});save();updCount();$('newT').value='';filter='all';renderChips();renderList()}
$('addBtn').onclick=add;$('newT').onkeydown=e=>{if(e.key==='Enter')add()};

load();updCount();renderChips();renderList();renderMood();
if(location.hash.startsWith('#import=')){const raw=location.hash;history.replaceState(null,'',location.pathname+location.search);
 setTimeout(()=>{if(confirm('Ajouter les idées partagées à ta liste ?')){const n=mergeCode(raw);toast(n<0?'Lien invalide 😕':n+' idée'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''))}},400)}

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
